name = "signalDesktopEnhancements"
summary = "Signal Desktop Enhancements for NVDA"
description = """Provides keyboard shortcuts for quick navigation in Signal Desktop.
	Alt+1: Focus chats list
	Alt+2: Focus calls list
	Alt+3: Focus stories
	Alt+4: Focus main settings pane
	Ctrl+Shift+A: Focus conversations list
	Ctrl+1: Focus message input field
	Ctrl+2: Focus chat history"""
author = "Signal Desktop Enhancements"
url = "https://github.com/serrebi/signal-desktop-enhancements"
version = "1.0.0"
minimumNVDAVersion = "2024.1"
lastTestedNVDAVersion = "2026.1"
